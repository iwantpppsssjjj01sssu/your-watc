<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 그림자 -->
    <filter id="dropshadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#1A3A5C" flood-opacity="0.28"/>
    </filter>
    <filter id="softshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#1A3A5C" flood-opacity="0.18"/>
    </filter>

    <!-- 정면 몸통 그라데이션 (왼쪽 위 → 오른쪽 아래) -->
    <linearGradient id="frontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#74B8E8"/>
      <stop offset="55%"  stop-color="#4A9DD6"/>
      <stop offset="100%" stop-color="#2B7AB8"/>
    </linearGradient>

    <!-- 옆면 그라데이션 (어두운 측면) -->
    <linearGradient id="sideGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1B5A8A"/>
      <stop offset="100%" stop-color="#2A6EA0"/>
    </linearGradient>

    <!-- 상단 면 그라데이션 -->
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#A0D4F5"/>
      <stop offset="100%" stop-color="#74B8E8"/>
    </linearGradient>

    <!-- 소매 정면 그라데이션 -->
    <linearGradient id="sleeveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#64B0E2"/>
      <stop offset="100%" stop-color="#2E7AB8"/>
    </linearGradient>

    <!-- 소매 옆면 그라데이션 -->
    <linearGradient id="sleeveSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1A5080"/>
      <stop offset="100%" stop-color="#2468A0"/>
    </linearGradient>

    <!-- 칼라 그라데이션 -->
    <linearGradient id="collarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D8E8F5"/>
    </linearGradient>

    <!-- 칼라 안쪽 그림자 -->
    <linearGradient id="collarInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#B0C8DC"/>
      <stop offset="100%" stop-color="#8AAFC8"/>
    </linearGradient>

    <!-- 바닥 그림자 타원 -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1A3A5C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1A3A5C" stop-opacity="0"/>
    </radialGradient>

    <!-- 하이라이트 -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="40%"  stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 줄무늬 패턴 -->
    <pattern id="stripe" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="12" height="12" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#3A8AC8" stroke-width="0.6" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- 바닥 그림자 타원 -->
  <ellipse cx="102" cy="188" rx="58" ry="9" fill="url(#groundShadow)"/>

  <!-- ── 왼쪽 소매 ── -->
  <!-- 소매 옆면 (하단 어두운 면) -->
  <path d="M 46 72  L 24 82  L 18 112  L 40 106  Z"
        fill="url(#sleeveSide)" opacity="0.9"/>
  <!-- 소매 정면 -->
  <path d="M 54 58  L 46 72  L 40 106  L 52 102  L 62 68  Z"
        fill="url(#sleeveGrad)" filter="url(#softshadow)"/>
  <!-- 소매 상단 면 -->
  <path d="M 54 58  L 70 52  L 68 60  L 62 68  Z"
        fill="url(#topGrad)" opacity="0.85"/>
  <!-- 소매 커프스 -->
  <path d="M 40 106  L 52 102  L 54 110  L 42 114  Z"
        fill="#FFFFFF" opacity="0.9"/>
  <line x1="40" y1="106" x2="52" y2="102" stroke="#3A8AC8" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- ── 오른쪽 소매 ── -->
  <!-- 소매 옆면 (어두운 오른쪽) -->
  <path d="M 154 58  L 162 72  L 170 102  L 158 106  L 148 70  Z"
        fill="url(#sleeveSide)" opacity="0.85"/>
  <!-- 소매 정면 -->
  <path d="M 140 56  L 148 70  L 158 106  L 148 108  L 136 66  Z"
        fill="url(#sleeveGrad)" filter="url(#softshadow)"/>
  <!-- 소매 상단 면 -->
  <path d="M 140 56  L 154 58  L 148 70  L 136 66  Z"
        fill="url(#topGrad)" opacity="0.8"/>
  <!-- 소매 커프스 -->
  <path d="M 148 108  L 158 106  L 160 114  L 150 116  Z"
        fill="#FFFFFF" opacity="0.9"/>
  <line x1="148" y1="108" x2="158" y2="106" stroke="#3A8AC8" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- ── 몸통 오른쪽 측면 (3D 깊이) ── -->
  <path d="M 146 52  L 162 60  L 164 162  L 148 154  Z"
        fill="url(#sideGrad)"/>

  <!-- ── 몸통 상단 면 ── -->
  <path d="M 54 52  L 146 52  L 162 60  L 70 60  Z"
        fill="url(#topGrad)" opacity="0.9"/>

  <!-- ── 몸통 정면 (메인) ── -->
  <path d="M 54 52  L 146 52  L 148 154  L 52 154  Z"
        fill="url(#frontGrad)" filter="url(#dropshadow)"/>

  <!-- 줄무늬 오버레이 (정면) -->
  <path d="M 54 52  L 146 52  L 148 154  L 52 154  Z"
        fill="url(#stripe)" opacity="0.7"/>

  <!-- 하이라이트 (왼쪽 상단 광택) -->
  <path d="M 54 52  L 100 52  L 100 154  L 52 154  Z"
        fill="url(#highlight)"/>

  <!-- ── 버튼 플라킷 (중앙선) ── -->
  <!-- 플라킷 좌우 스티치선 -->
  <line x1="97" y1="72" x2="97" y2="154" stroke="#3A8AC8" stroke-width="0.7" stroke-opacity="0.5" stroke-dasharray="none"/>
  <line x1="103" y1="72" x2="103" y2="154" stroke="#3A8AC8" stroke-width="0.7" stroke-opacity="0.5"/>
  <!-- 플라킷 중앙 음영 -->
  <rect x="97" y="72" width="6" height="82" fill="#2A6EA0" opacity="0.12" rx="1"/>

  <!-- 버튼 (5개) -->
  <circle cx="100" cy="85"  r="3.5" fill="#FFFFFF" stroke="#4A9DD6" stroke-width="1.2"/>
  <circle cx="100" cy="85"  r="1.2" fill="#CDE8FA"/>
  <circle cx="100" cy="101" r="3.5" fill="#FFFFFF" stroke="#4A9DD6" stroke-width="1.2"/>
  <circle cx="100" cy="101" r="1.2" fill="#CDE8FA"/>
  <circle cx="100" cy="117" r="3.5" fill="#FFFFFF" stroke="#4A9DD6" stroke-width="1.2"/>
  <circle cx="100" cy="117" r="1.2" fill="#CDE8FA"/>
  <circle cx="100" cy="133" r="3.5" fill="#FFFFFF" stroke="#4A9DD6" stroke-width="1.2"/>
  <circle cx="100" cy="133" r="1.2" fill="#CDE8FA"/>
  <circle cx="100" cy="149" r="3.5" fill="#FFFFFF" stroke="#4A9DD6" stroke-width="1.2"/>
  <circle cx="100" cy="149" r="1.2" fill="#CDE8FA"/>

  <!-- ── 왼쪽 가슴 포켓 ── -->
  <path d="M 65 86  L 86 86  L 86 104  L 65 104  Z"
        fill="none" stroke="#3A8AC8" stroke-width="1.1" stroke-opacity="0.6" rx="2"/>
  <!-- 포켓 상단 플랩 -->
  <path d="M 65 86  L 86 86  L 84 82  L 67 82  Z"
        fill="#3C8EC8" opacity="0.25"/>
  <line x1="65" y1="86" x2="86" y2="86" stroke="#3A8AC8" stroke-width="1" stroke-opacity="0.5"/>

  <!-- ── 몸통 하단 면 (하단 3D 두께) ── -->
  <path d="M 52 154  L 148 154  L 164 162  L 68 162  Z"
        fill="#1B5A8A" opacity="0.7"/>

  <!-- ── 칼라 영역 ── -->
  <!-- 칼라 뒷면 (어두운 밴드) -->
  <path d="M 80 52  L 120 52  L 116 44  L 84 44  Z"
        fill="#2870A8"/>

  <!-- 왼쪽 칼라 (라펠) -->
  <path d="M 80 52  L 100 74  L 84 68  L 72 58  Z"
        fill="url(#collarGrad)" stroke="#C8DCE8" stroke-width="0.8"/>
  <!-- 오른쪽 칼라 (라펠) -->
  <path d="M 120 52  L 100 74  L 116 68  L 128 58  Z"
        fill="url(#collarGrad)" stroke="#C8DCE8" stroke-width="0.8"/>

  <!-- 칼라 안쪽 그림자 (V존 그림자) -->
  <path d="M 88 52  L 100 74  L 112 52  Z"
        fill="url(#collarInner)" opacity="0.45"/>

  <!-- 칼라 넥 밴드 -->
  <path d="M 84 44  L 116 44  L 120 52  L 80 52  Z"
        fill="url(#collarGrad)" stroke="#B8CCD8" stroke-width="0.7"/>

  <!-- 칼라 라펠 스티치 디테일 -->
  <path d="M 78 55  L 98 72" stroke="#3A8AC8" stroke-width="0.6" stroke-opacity="0.35" stroke-dasharray="2,2"/>
  <path d="M 122 55  L 102 72" stroke="#3A8AC8" stroke-width="0.6" stroke-opacity="0.35" stroke-dasharray="2,2"/>
</svg>
