<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- 배경 -->
  <rect width="400" height="300" fill="#f0fdf4"/>

  <!-- 그림자 -->
  <ellipse cx="200" cy="272" rx="80" ry="10" fill="rgba(0,0,0,0.08)"/>

  <!-- 에코백 몸통 -->
  <path d="M120 130 L100 265 Q100 272 108 272 L292 272 Q300 272 300 265 L280 130 Z"
    fill="#ffffff" stroke="#86efac" stroke-width="2.5"/>

  <!-- 에코백 손잡이 왼쪽 -->
  <path d="M155 130 C155 95 175 75 200 75 C225 75 245 95 245 130"
    fill="none" stroke="#4ade80" stroke-width="8" stroke-linecap="round"/>

  <!-- 에코백 표면 질감 — 캔버스 느낌 세로 줄 -->
  <g stroke="#dcfce7" stroke-width="1" opacity="0.7">
    <line x1="140" y1="135" x2="132" y2="265"/>
    <line x1="160" y1="132" x2="154" y2="267"/>
    <line x1="180" y1="130" x2="176" y2="268"/>
    <line x1="200" y1="130" x2="200" y2="268"/>
    <line x1="220" y1="130" x2="224" y2="268"/>
    <line x1="240" y1="132" x2="246" y2="267"/>
    <line x1="260" y1="135" x2="268" y2="265"/>
  </g>

  <!-- 에코백 앞면 패치 — 잎사귀 로고 -->
  <rect x="158" y="165" width="84" height="68" rx="10"
    fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>

  <!-- 잎사귀 -->
  <path d="M200 195 C200 195 182 182 175 170 C175 170 194 168 200 180 C206 168 225 170 225 170 C218 182 200 195 200 195 Z"
    fill="#22c55e"/>
  <line x1="200" y1="194" x2="200" y2="218" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
  <path d="M200 208 C195 204 188 205 186 208" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- ECO 텍스트 -->
  <text x="200" y="227" font-family="Arial" font-size="11" font-weight="900"
    fill="#16a34a" text-anchor="middle" letter-spacing="2">ECO BAG</text>

  <!-- 왼쪽 잎새 장식 -->
  <path d="M112 100 C112 100 100 88 98 78 C98 78 110 80 114 90 C118 80 130 78 130 78 C128 88 112 100 112 100 Z"
    fill="#86efac" opacity="0.6"/>
  <path d="M290 110 C290 110 300 96 298 86 C298 86 288 90 288 100 C282 90 272 92 272 92 C276 102 290 110 290 110 Z"
    fill="#86efac" opacity="0.5"/>

  <!-- 작은 빛 반사 -->
  <ellipse cx="145" cy="145" rx="6" ry="10" fill="rgba(255,255,255,0.4)" transform="rotate(-15 145 145)"/>
</svg>
