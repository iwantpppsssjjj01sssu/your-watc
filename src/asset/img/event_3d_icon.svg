<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- 선물 상자 상단 면 그라디언트 (밝은 amber) -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <!-- 선물 상자 정면 그라디언트 -->
    <linearGradient id="frontFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <!-- 선물 상자 우측 면 그라디언트 (어두운 amber) -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <!-- 리본 정면 -->
    <linearGradient id="ribbonFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <!-- 리본 우측 -->
    <linearGradient id="ribbonRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <!-- 리본 상단 -->
    <linearGradient id="ribbonTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCA5A5"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <!-- 뚜껑 정면 -->
    <linearGradient id="lidFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <!-- 뚜껑 우측 -->
    <linearGradient id="lidRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <!-- 뚜껑 상단 -->
    <linearGradient id="lidTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <!-- 별 그라디언트 -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="60%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </radialGradient>
    <!-- 배경 글로우 -->
    <radialGradient id="bgGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>
    <!-- 그림자 필터 -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#D97706" flood-opacity="0.35"/>
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#FBBF24" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- 배경 글로우 원 -->
  <ellipse cx="100" cy="130" rx="68" ry="18" fill="#D97706" opacity="0.18"/>
  <circle cx="100" cy="100" r="72" fill="url(#bgGlow)"/>

  <!-- ========== 선물 박스 본체 (3D 아이소메트릭) ========== -->
  <g filter="url(#softShadow)">
    <!-- 본체 정면 -->
    <polygon points="55,100 55,148 103,162 103,114" fill="url(#frontFace)"/>
    <!-- 본체 우측 -->
    <polygon points="103,114 103,162 145,148 145,100" fill="url(#rightFace)"/>
    <!-- 본체 상단 -->
    <polygon points="55,100 99,86 145,100 103,114" fill="url(#topFace)"/>

    <!-- 본체 정면 리본 (세로) -->
    <polygon points="92,100 92,149 98,151 98,102" fill="url(#ribbonFront)"/>
    <!-- 본체 우측 리본 (세로) -->
    <polygon points="98,102 98,151 108,148 108,100" fill="url(#ribbonRight)"/>

    <!-- ========== 뚜껑 ========== -->
    <!-- 뚜껑 정면 -->
    <polygon points="53,90 53,104 101,118 101,104" fill="url(#lidFront)"/>
    <!-- 뚜껑 우측 -->
    <polygon points="101,104 101,118 147,104 147,90" fill="url(#lidRight)"/>
    <!-- 뚜껑 상단 -->
    <polygon points="53,90 99,76 147,90 101,104" fill="url(#lidTop)"/>

    <!-- 뚜껑 정면 리본 -->
    <polygon points="91,90 91,105 97,107 97,92" fill="url(#ribbonFront)"/>
    <!-- 뚜껑 우측 리본 -->
    <polygon points="97,92 97,107 107,104 107,90" fill="url(#ribbonRight)"/>
    <!-- 뚜껑 상단 리본 -->
    <polygon points="91,90 99,87 107,90 101,93" fill="url(#ribbonTop)"/>
  </g>

  <!-- ========== 리본 보우 (나비 리본) ========== -->
  <g filter="url(#glowFilter)">
    <!-- 왼쪽 루프 -->
    <path d="M99,72 C88,62 72,60 76,72 C80,82 95,79 99,72Z" fill="#EF4444" stroke="#B91C1C" stroke-width="1"/>
    <!-- 오른쪽 루프 -->
    <path d="M99,72 C110,62 126,60 122,72 C118,82 103,79 99,72Z" fill="#DC2626" stroke="#991B1B" stroke-width="1"/>
    <!-- 중심 매듭 -->
    <ellipse cx="99" cy="74" rx="5" ry="4.5" fill="#FCA5A5"/>
    <!-- 리본 꼬리 왼쪽 -->
    <path d="M96,76 C90,82 82,88 84,90 C86,90 94,84 98,78Z" fill="#EF4444"/>
    <!-- 리본 꼬리 오른쪽 -->
    <path d="M102,76 C108,82 116,88 114,90 C112,90 104,84 100,78Z" fill="#DC2626"/>
  </g>

  <!-- ========== 주변 스파클 / 별 효과 ========== -->
  <!-- 큰 별 (우상단) -->
  <g transform="translate(148,48)" filter="url(#glowFilter)">
    <polygon points="0,-13 3,-4 13,-4 5,2 8,12 0,6 -8,12 -5,2 -13,-4 -3,-4" fill="url(#starGlow)" opacity="0.95"/>
  </g>
  <!-- 중간 별 (좌상단) -->
  <g transform="translate(48,60)">
    <polygon points="0,-9 2.3,-3 9,-3 4,1 5.5,8 0,4 -5.5,8 -4,1 -9,-3 -2.3,-3" fill="#FDE047" opacity="0.85"/>
  </g>
  <!-- 작은 별 (우하단) -->
  <g transform="translate(152,118)">
    <polygon points="0,-6 1.5,-2 6,-2 2.5,1 3.5,5.5 0,3 -3.5,5.5 -2.5,1 -6,-2 -1.5,-2" fill="#FCD34D" opacity="0.8"/>
  </g>

  <!-- 스파클 점 (작은 십자) -->
  <g opacity="0.9">
    <!-- 우측 상단 스파클 -->
    <line x1="162" y1="70" x2="162" y2="80" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="157" y1="75" x2="167" y2="75" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 좌측 스파클 -->
    <line x1="36" y1="95" x2="36" y2="103" stroke="#FDE68A" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="99" x2="40" y2="99" stroke="#FDE68A" stroke-width="2" stroke-linecap="round"/>
    <!-- 좌상 작은 점 스파클 -->
    <circle cx="58" cy="44" r="3.5" fill="#FCD34D" opacity="0.8"/>
    <circle cx="148" cy="140" r="2.5" fill="#FBBF24" opacity="0.7"/>
    <circle cx="40" cy="130" r="2" fill="#FDE68A" opacity="0.6"/>
    <circle cx="160" cy="52" r="2" fill="#FEFCE8" opacity="0.7"/>
  </g>

  <!-- ========== % 할인 뱃지 ========== -->
  <circle cx="152" cy="88" r="18" fill="#EF4444" filter="url(#softShadow)" opacity="0.95"/>
  <circle cx="152" cy="88" r="15" fill="#EF4444" stroke="#FCA5A5" stroke-width="1.5" opacity="0.95"/>
  <text x="152" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF">%</text>
</svg>
