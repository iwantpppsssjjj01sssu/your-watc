<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bubble1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bubble2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bubble3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9f99d"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <linearGradient id="smallBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="s1" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#7c3aed" flood-opacity="0.22"/>
    </filter>
    <filter id="s2" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1" dy="3" stdDeviation="4" flood-color="#7c3aed" flood-opacity="0.18"/>
    </filter>
    <filter id="glowLime" x="-40%" y="-40%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a3e635" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 바닥 그림자 -->
  <ellipse cx="80" cy="150" rx="48" ry="7" fill="rgba(124,58,237,0.10)"/>

  <!-- ── 메인 큰 말풍선 (보라) ── -->
  <rect x="14" y="22" width="108" height="76" rx="20" fill="url(#bubble2)" filter="url(#s1)"/>
  <!-- 말풍선 꼬리 -->
  <path d="M 34 98 L 22 118 L 54 100 Z" fill="#7c3aed"/>
  <!-- 메인 말풍선 하이라이트 -->
  <rect x="14" y="22" width="108" height="30" rx="20" fill="rgba(255,255,255,0.18)"/>
  <!-- 내부 흰색 글자 라인 3개 -->
  <rect x="28" y="42" width="60" height="7" rx="3.5" fill="rgba(255,255,255,0.85)"/>
  <rect x="28" y="55" width="44" height="7" rx="3.5" fill="rgba(255,255,255,0.65)"/>
  <rect x="28" y="68" width="52" height="7" rx="3.5" fill="rgba(255,255,255,0.5)"/>
  <!-- TALK 텍스트 -->
  <text x="100" y="73" text-anchor="middle" font-size="11" font-weight="900"
        fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif" letter-spacing="1">TALK</text>

  <!-- ── 오른쪽 중간 작은 말풍선 (연보라) ── -->
  <rect x="100" y="62" width="46" height="36" rx="12" fill="url(#smallBubble)" filter="url(#s2)"/>
  <!-- 꼬리 -->
  <path d="M 108 98 L 102 112 L 122 100 Z" fill="#c084fc"/>
  <!-- 내부 라인 -->
  <rect x="108" y="72" width="28" height="5" rx="2.5" fill="rgba(124,58,237,0.5)"/>
  <rect x="108" y="82" width="20" height="5" rx="2.5" fill="rgba(124,58,237,0.35)"/>

  <!-- ── 연두 작은 말풍선 (우측 상단) ── -->
  <rect x="110" y="16" width="38" height="30" rx="10" fill="url(#bubble3)" filter="url(#glowLime)"/>
  <!-- 꼬리 -->
  <path d="M 116 46 L 112 58 L 128 48 Z" fill="#84cc16"/>
  <!-- 내부 하트 / 느낌표 -->
  <text x="129" y="36" text-anchor="middle" font-size="15" font-family="Arial">❤️</text>

  <!-- ── 연두 별 스파클 ── -->
  <g filter="url(#glowLime)">
    <path d="M 10 52 L 11.8 57.5 L 17.5 57.5 L 13 60.8 L 14.8 66.5 L 10 63 L 5.2 66.5 L 7 60.8 L 2.5 57.5 L 8.2 57.5 Z"
          fill="#a3e635"/>
    <path d="M 148 90 L 149.4 94.3 L 153.8 94.3 L 150.5 96.8 L 151.9 101 L 148 98.6 L 144.1 101 L 145.5 96.8 L 142.2 94.3 L 146.6 94.3 Z"
          fill="#a3e635"/>
  </g>

  <!-- 작은 보라 원형 점들 -->
  <circle cx="8"   cy="96"  r="4"   fill="#c084fc" opacity="0.7"/>
  <circle cx="130" cy="130" r="5"   fill="#a855f7" opacity="0.5"/>
  <circle cx="18"  cy="130" r="3.5" fill="#84cc16" opacity="0.8" filter="url(#glowLime)"/>
  <circle cx="150" cy="52"  r="3"   fill="#c084fc" opacity="0.6"/>

  <!-- 연두 작은 별 (하단) -->
  <g filter="url(#glowLime)" transform="translate(55,120) rotate(15)">
    <path d="M 7 0 L 8.6 5.1 L 14 5.1 L 9.7 8.3 L 11.3 13.4 L 7 10.1 L 2.7 13.4 L 4.3 8.3 L 0 5.1 L 5.4 5.1 Z"
          fill="#a3e635"/>
  </g>
</svg>
